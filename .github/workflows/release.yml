name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./rust

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-branch:
    name: Check tag is on main
    # A dispatch against a branch (e.g. main) must not create a release.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag is not on main — skipping publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag matches the crate version
        run: |
          CRATE_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}."
            exit 1
          fi

  verify:
    name: Verify
    needs: check-branch
    if: needs.check-branch.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Python tests
        working-directory: .
        run: python3 -m unittest discover -s tests

  create_release:
    name: Create release
    needs: [check-branch, verify]
    if: needs.check-branch.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=~"
          cargo build --locked --release \
            --target x86_64-unknown-linux-musl \
            --bin dehulud --bin dehulud-combat
          for BIN_NAME in dehulud dehulud-combat; do
            BINARY="target/x86_64-unknown-linux-musl/release/$BIN_NAME"
            strings -a "$BINARY" > "$RUNNER_TEMP/${BIN_NAME}.strings"
            HOME_MATCHES=$(grep -c -F "$HOME" "$RUNNER_TEMP/${BIN_NAME}.strings" || [ "$?" -eq 1 ])
            echo "$BIN_NAME: $HOME_MATCHES home-path matches"
            if [ "$HOME_MATCHES" -ne 0 ]; then
              echo "::error::Build contains the home directory: $BIN_NAME"
              exit 1
            fi
          done

      - name: Package programs
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          mkdir -p "$RUNNER_TEMP/package/DeHulud" "$RUNNER_TEMP/package/DeHulud-Combat"
          cp dehulud.py README.md "$RUNNER_TEMP/package/DeHulud/"
          cp rust/target/x86_64-unknown-linux-musl/release/dehulud "$RUNNER_TEMP/package/DeHulud/"
          cp dehulud.py dehulud_combat.py README.md "$RUNNER_TEMP/package/DeHulud-Combat/"
          cp rust/target/x86_64-unknown-linux-musl/release/dehulud-combat "$RUNNER_TEMP/package/DeHulud-Combat/"
          chmod 0755 "$RUNNER_TEMP/package/DeHulud/dehulud.py" "$RUNNER_TEMP/package/DeHulud/dehulud"
          chmod 0755 "$RUNNER_TEMP/package/DeHulud-Combat/dehulud.py" \
            "$RUNNER_TEMP/package/DeHulud-Combat/dehulud_combat.py" "$RUNNER_TEMP/package/DeHulud-Combat/dehulud-combat"
          cd "$RUNNER_TEMP/package"
          zip -r "$RUNNER_TEMP/dist/DeHulud-${TAG}.zip" DeHulud
          zip -r "$RUNNER_TEMP/dist/DeHulud-Combat-${TAG}.zip" DeHulud-Combat
          cd "$RUNNER_TEMP/dist"
          sha256sum "DeHulud-${TAG}.zip" "DeHulud-Combat-${TAG}.zip" > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="$RUNNER_TEMP/dist/DeHulud-${TAG}.zip"
          COMBAT_ARCHIVE="$RUNNER_TEMP/dist/DeHulud-Combat-${TAG}.zip"
          CHECKSUM="$RUNNER_TEMP/dist/SHA256SUMS"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets."
            gh release upload "$TAG" "$ARCHIVE" "$COMBAT_ARCHIVE" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "$ARCHIVE" \
              "$COMBAT_ARCHIVE" \
              "$CHECKSUM"
          fi
